services:
  risk-platform:
    build: .
    container_name: risk-control-platform
    ports:
      - "80:80"
    env_file:
      # 所有配置（含 FRONTEND_URL / LARK / AI / 数数 等）从这里读取
      - backend/.env
    volumes:
      # 持久化 KYC 解析数据
      - kyc-data:/app/backend/data
      # 持久化 SQLite 数据库文件，避免 --build 重建容器后丢失数据
      - risk-db:/app/backend/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  kyc-data:
  risk-db:

